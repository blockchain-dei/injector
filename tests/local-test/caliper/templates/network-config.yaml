name: Fabric
version: '1.0'
mutual-tls: false
caliper:
  blockchain: fabric-ccp
  command:
    start: rm -rf /tmp/hfc-*
    end: rm -rf /tmp/hfc-*
info:
  Version: 1.4.0
  Size: 2 Orgs with 1 Peer
  Orderer: Solo
  Distribution: Single Host
  StateDB: GoLevelDB
clients:
  client1.org1.example.com:
    client:
      organization: Org1
      credentialStore:
        path: "/tmp/hfc-kvs/org1"
        cryptoStore:
          path: "/tmp/hfc-cvs/org1"
      clientPrivateKey:
        path: "../smartcontract-faultinjection/tests/local-test/fabric/crypto-config/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/keystore/key.pem"
      clientSignedCert:
        path: "../smartcontract-faultinjection/tests/local-test/fabric/crypto-config/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/signcerts/User1@org1.example.com-cert.pem"
  client2.org1.example.com:
    client:
      organization: Org1
      credentialStore:
        path: "/tmp/hfc-kvs/org1"
        cryptoStore:
          path: "/tmp/hfc-cvs/org1"
      clientPrivateKey:
        path: "../smartcontract-faultinjection/tests/local-test/fabric/crypto-config/peerOrganizations/org1.example.com/users/User2@org1.example.com/msp/keystore/key.pem"
      clientSignedCert:
        path: "../smartcontract-faultinjection/tests/local-test/fabric/crypto-config/peerOrganizations/org1.example.com/users/User2@org1.example.com/msp/signcerts/User2@org1.example.com-cert.pem"
  client3.org1.example.com:
    client:
      organization: Org1
      credentialStore:
        path: "/tmp/hfc-kvs/org1"
        cryptoStore:
          path: "/tmp/hfc-cvs/org1"
      clientPrivateKey:
        path: "../smartcontract-faultinjection/tests/local-test/fabric/crypto-config/peerOrganizations/org1.example.com/users/User3@org1.example.com/msp/keystore/key.pem"
      clientSignedCert:
        path: "../smartcontract-faultinjection/tests/local-test/fabric/crypto-config/peerOrganizations/org1.example.com/users/User3@org1.example.com/msp/signcerts/User3@org1.example.com-cert.pem"
  client1.org2.example.com:
    client:
      organization: Org2
      credentialStore:
        path: "/tmp/hfc-kvs/org2"
        cryptoStore:
          path: "/tmp/hfc-cvs/org2"
      clientPrivateKey:
        path: "../smartcontract-faultinjection/tests/local-test/fabric/crypto-config/peerOrganizations/org2.example.com/users/User1@org2.example.com/msp/keystore/key.pem"
      clientSignedCert:
        path: "../smartcontract-faultinjection/tests/local-test/fabric/crypto-config/peerOrganizations/org2.example.com/users/User1@org2.example.com/msp/signcerts/User1@org2.example.com-cert.pem"
  client2.org2.example.com:
    client:
      organization: Org2
      credentialStore:
        path: "/tmp/hfc-kvs/org2"
        cryptoStore:
          path: "/tmp/hfc-cvs/org2"
      clientPrivateKey:
        path: "../smartcontract-faultinjection/tests/local-test/fabric/crypto-config/peerOrganizations/org2.example.com/users/User2@org2.example.com/msp/keystore/key.pem"
      clientSignedCert:
        path: "../smartcontract-faultinjection/tests/local-test/fabric/crypto-config/peerOrganizations/org2.example.com/users/User2@org2.example.com/msp/signcerts/User2@org2.example.com-cert.pem"
  client3.org2.example.com:
    client:
      organization: Org2
      credentialStore:
        path: "/tmp/hfc-kvs/org2"
        cryptoStore:
          path: "/tmp/hfc-cvs/org2"
      clientPrivateKey:
        path: "../smartcontract-faultinjection/tests/local-test/fabric/crypto-config/peerOrganizations/org2.example.com/users/User3@org2.example.com/msp/keystore/key.pem"
      clientSignedCert:
        path: "../smartcontract-faultinjection/tests/local-test/fabric/crypto-config/peerOrganizations/org2.example.com/users/User3@org2.example.com/msp/signcerts/User3@org2.example.com-cert.pem"
channels:
  mychannel:
    configBinary: "../smartcontract-faultinjection/tests/local-test/fabric/mychannel.tx"
    created: false
    orderers:
    - orderer.example.com
    peers:
      peer0.org1.example.com:
        eventSource: true
      peer0.org2.example.com:
        eventSource: true
    evmProxyChaincode:
      targetPeers:
      - peer0.org1.example.com
      - peer0.org2.example.com
    chaincodes: []
organizations:
  Org1:
    mspid: Org1MSP
    peers:
    - peer0.org1.example.com
    adminPrivateKey:
      path: "../smartcontract-faultinjection/tests/local-test/fabric/crypto-config/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/keystore/key.pem"
    signedCert:
      path: "../smartcontract-faultinjection/tests/local-test/fabric/crypto-config/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/signcerts/Admin@org1.example.com-cert.pem"
  Org2:
    mspid: Org2MSP
    peers:
    - peer0.org2.example.com
    adminPrivateKey:
      path: "../smartcontract-faultinjection/tests/local-test/fabric/crypto-config/peerOrganizations/org2.example.com/users/Admin@org2.example.com/msp/keystore/key.pem"
    signedCert:
      path: "../smartcontract-faultinjection/tests/local-test/fabric/crypto-config/peerOrganizations/org2.example.com/users/Admin@org2.example.com/msp/signcerts/Admin@org2.example.com-cert.pem"
orderers:
  orderer.example.com:
    url: grpcs://localhost:7050
    grpcOptions:
      ssl-target-name-override: orderer.example.com
    tlsCACerts:
      path: "../smartcontract-faultinjection/tests/local-test/fabric/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/msp/tlscacerts/tlsca.example.com-cert.pem"
peers:
  peer0.org1.example.com:
    url: grpcs://localhost:7051
    grpcOptions:
      ssl-target-name-override: peer0.org1.example.com
      grpc.keepalive_time_ms: 600000
    tlsCACerts:
      path: "../smartcontract-faultinjection/tests/local-test/fabric/crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/msp/tlscacerts/tlsca.org1.example.com-cert.pem"
  peer0.org2.example.com:
    url: grpcs://localhost:8051
    grpcOptions:
      ssl-target-name-override: peer0.org2.example.com
      grpc.keepalive_time_ms: 600000
    tlsCACerts:
      path: "../smartcontract-faultinjection/tests/local-test/fabric/crypto-config/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/msp/tlscacerts/tlsca.org2.example.com-cert.pem"
